<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VibeFlow</title><link rel="stylesheet" href="css/styles.css"><style>.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50}.box{background:#17131f;border:1px solid #8b5cf6;border-radius:12px;padding:16px;width:min(440px,92vw);max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:8px}.box button{text-align:left}.box h3{margin:0 0 4px;color:#ece8f5}#libtools{display:none;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{background:#17131f;border:1px solid #2a2338;border-radius:8px;padding:8px 12px;cursor:pointer}.hk{display:flex;gap:8px;margin-bottom:8px}.hk input{flex:1;background:#17131f;border:1px solid #2a2338;border-radius:8px;color:#ece8f5;padding:8px 10px;font:inherit}#hooks{margin-bottom:12px}</style></head>
<body>
<div class="app">
  <nav class="side"><h1>VibeFlow</h1>
    <button data-view="discover" class="on">Discover</button><button data-view="radio">AI Radio</button>
    <button data-view="lib">My Library</button><button data-view="favs">Favourites</button><button data-view="history">History</button><button data-view="diag">Diagnostics</button></nav>
  <main>
    <section class="now"><img id="art" alt=""><div><h2 id="title">Nothing playing</h2><p id="artist">Search or start AI Radio</p>
      <p id="why" class="why"></p></div></section>
    <div id="hooks"></div>
    <div id="libtools"><label class="btn">Find my songs<input id="pick" type="file" accept="audio/*" multiple hidden></label><button id="dl">Download songs.json</button><button id="rl">Reload from songs.json</button></div>
    <form id="sf"><input id="q" placeholder="Search Audius tracks or artists" autocomplete="off"><button>Search</button></form>
    <h3 id="vh">Trending on Audius</h3><div id="list" class="list"></div>
    <h3>Next-track suggestions</h3><div id="recs" class="list"></div>
  </main>
  <aside class="queue"><h3>Queue</h3><div id="queue" class="list"></div></aside>
  <footer class="bar">
    <div class="ctl"><button id="prev" aria-label="Previous">⏮</button><button id="pp" aria-label="Play or pause">▶</button><button id="next" aria-label="Next">⏭</button>
      <button id="mix">Mix &amp; next</button><button id="shuf">Shuffle</button><button id="rep">Repeat</button></div>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Progress"><span id="time">0:00</span>
    <label>Mix length <select id="mixsec"><option value="3">3s</option><option value="6" selected>6s</option><option value="10">10s</option></select></label>
    <label><input type="checkbox" id="auto" checked> Auto-mix</label>
    <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
    <button id="radio">AI Radio: off</button>
  </footer>
</div>
<div id="toast" role="status"></div>
<audio id="a1" preload="auto"></audio><audio id="a2" preload="auto"></audio>
<script src="js/app.js"></script></body></html>
